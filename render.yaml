# Render Blueprint: one free Docker web service. DATABASE_URL (Neon) is entered in the dashboard, never committed.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    region: frankfurt # same region as the Neon DB (AWS eu-central-1) to keep query latency low
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
